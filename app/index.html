<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Comic — Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Sunset Comic</h1>
    <p class="tag">You, in Vice City — a photo and a caption, made into a comic-book cover in about thirty seconds. Your photos never leave this machine.</p>

    <label>Photos (up to 4 — hero, then 3 vignettes)
      <input id="photo" type="file" accept="image/*" multiple>
    </label>
    <div class="samples" id="samples" aria-label="Sample photos"></div>

    <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="You, in Vice City"></label>

    <div class="group"><span class="glabel">Grade</span><div class="segrow" id="presets"></div></div>
    <div class="group"><span class="glabel">Post size</span><div class="segrow" id="sizes"></div></div>
    <div class="group"><span class="glabel">Layout</span><div class="segrow" id="layouts"></div></div>

    <div class="group"><span class="glabel">Tune panel</span><div class="segrow" id="panels"></div></div>
    <label>Zoom <input id="zoom" type="range" min="1" max="2" step="0.01" value="1"><span class="val" id="zoomVal">1.00×</span></label>
    <label>Pan X <input id="panx" type="range" min="-1" max="1" step="0.01" value="0"></label>
    <label>Pan Y <input id="pany" type="range" min="-1" max="1" step="0.01" value="0"><span class="val" id="panVal">0.00, 0.00</span></label>
    <div class="group"><span class="glabel">…or draw this panel instead</span><div class="segrow" id="scenes"></div></div>

    <label>Halftone <input id="halftone" type="range" min="0" max="1" step="0.05" value="0.55"></label>
    <label>Ink outline <input id="ink" type="range" min="0" max="1" step="0.05" value="0.6"></label>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
    <p id="time" class="time"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
